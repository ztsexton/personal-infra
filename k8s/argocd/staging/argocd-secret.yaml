# Argo CD's own admin credential, owned by the 1Password operator.
#
# Argo CD reads the admin password only from the argocd-secret Secret, keys
# admin.password (bcrypt) and admin.passwordMtime. There is no valueFrom
# indirection, so the only way for 1Password to be the source of truth is for the
# operator to own that Secret outright -- which is what naming this CR
# "argocd-secret" does.
#
# TWO THINGS MAKE THIS SHARPER THAN THE OTHER OnePasswordItems HERE:
#
# 1. The operator replaces the Secret's data wholesale, so every key it holds has
#    to exist as a field on the 1Password item. argocd-secret is not only the
#    password: it also carries server.secretkey, which signs session JWTs. A
#    field missing from the item is a key deleted from the cluster on the next
#    sync. scripts/setup/argocd-admin-secret.sh builds the item by copying the
#    live Secret, so the set is taken from the cluster rather than guessed, and
#    its `verify` re-checks the coverage afterwards.
#
# 2. The Secret gets ownerReferences pointing at this CR. Deleting this file
#    garbage-collects argocd-secret with it, taking the admin password and the
#    session key -- and the root Application runs with prune: true, so removing
#    the file from git is enough. Rotate the password by editing the 1Password
#    item (`argocd-admin-secret.sh rotate staging-ovh`), never by deleting this.
#
# The plaintext password is deliberately NOT in this item. It lives in a separate
# 1Password login item, "Argo CD (staging)", which humans use to sign in. Nothing
# in the cluster can recover it from the hash, which is the point.
#
# Bootstrap ordering: a from-scratch cluster still gets its first argocd-secret
# from the Terraform bootstrap's Helm values, because Argo CD has to be running
# before it can deploy the operator that would otherwise supply the password.
# The operator takes the Secret over afterwards. Wave 1 keeps this behind the
# onepassword-operator Application at wave 0, so the CRD exists when it applies.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  itemPath: "vaults/Kubernetes/items/argocd-admin-staging"

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/ztsexton/personal-infra.git
    path: k8s/postgres/overlays/staging
    targetRevision: HEAD
    # No `directory:` block. It forces Argo into plain-directory mode, where
    # kustomization.yaml is read as a manifest to apply rather than as a build
    # directive -- the sync then fails with "one or more synchronization tasks
    # are not valid" and a phantom Kustomization/ resource. Every other app
    # pointing at an overlay leaves this out and lets Argo detect kustomize.
  destination:
    server: https://kubernetes.default.svc
    namespace: web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 28.3.0
    helm:
      values: |
        deployment:
          replicas: 1
        service:
          type: LoadBalancer
          loadBalancerIP: 178.156.205.252
        ports:
          web:
            port: 80
            expose:
              default: true
          websecure:
            port: 443
            expose:
              default: true
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesIngress:
            enabled: true
            allowExternalNameServices: true
            # Write the LoadBalancer address back onto every Ingress's
            # status.loadBalancer.
            #
            # Without it that field stays empty, and Argo CD judges an Ingress
            # healthy by exactly that field -- so every Ingress sits at
            # Progressing forever. Combined with PruneLast=true, which holds a
            # sync open until all resources report healthy, no sync of the apps
            # Application can ever complete: manifests update in git, Argo
            # reaches the right revision, and the Deployment is never applied.
            # A staging deploy hung for 50 minutes this way with nothing in the
            # events explaining it.
            publishedService:
              enabled: true
          kubernetesCRD:
            enabled: true
            allowExternalNameServices: true
        api:
          dashboard: true
          insecure: true
        metrics:
          prometheus:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

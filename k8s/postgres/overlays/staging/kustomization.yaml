apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The base asks for 4Gi, which is more memory than a 4GB node has allocatable
# at all -- so on staging the database could never be scheduled, whatever else
# was running:
#
#   0/1 nodes are available: 1 Insufficient cpu, 1 Insufficient memory
#
# Those are production-shaped numbers. Staging holds a handful of rows and
# serves one person, so it gets production's shape at a fraction of the size.
# Limits are kept well above requests: this is about what has to be reserved to
# schedule, not about capping what it may use under load.
patches:
  - target:
      kind: PostgresCluster
      name: ballroom-db
    patch: |-
      - op: replace
        path: /spec/instances/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

  # A database and user for ballroom-progress-tracker, staging only.
  #
  # Added here rather than in the base because the app itself is staging-only
  # for now: putting it in the base would create the role and database on
  # production too, for an app production does not run.
  #
  # PGO generates the password and publishes the whole connection string as
  # `uri` in the secret ballroom-db-pguser-progress.
  - target:
      kind: PostgresCluster
      name: ballroom-db
    patch: |-
      - op: add
        path: /spec/users/-
        value:
          name: progress
          databases:
            - ballroom_progress

  # Grants for both users, in the databases they actually use.
  #
  # The base init.sql grants without switching database, so psql runs it all
  # against `postgres` -- the ACL on ballroom_scorer's public schema shows no
  # ballroom entry at all, only the default. Since PostgreSQL 15 the public
  # schema grants PUBLIC nothing but USAGE, so a user who does not own the
  # database cannot create tables in it, which is exactly how the tracker's
  # first migration failed:
  #
  #   ERROR: permission denied for schema public
  #
  # \connect switches database inside a single psql run, so each GRANT lands
  # where it is meant to.
  - target:
      kind: ConfigMap
      name: ballroom-db-init
    patch: |-
      - op: replace
        path: /data/init.sql
        value: |
          \connect ballroom_scorer
          GRANT ALL ON SCHEMA public TO ballroom;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ballroom;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ballroom;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO ballroom;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ballroom;

          \connect ballroom_progress
          GRANT ALL ON SCHEMA public TO progress;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO progress;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO progress;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO progress;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO progress;


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ballroom-progress-tracker-ingress
  namespace: web
spec:
  ingressClassName: traefik
  tls:
    # Covered by the existing *.zachsexton.com wildcard, so this host needs no
    # Certificate of its own and no new ACME order.
    - secretName: zachsexton-wildcard-tls
      hosts:
        - progress-staging.zachsexton.com
  rules:
    - host: progress-staging.zachsexton.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ballroom-progress-tracker
                port:
                  number: 80

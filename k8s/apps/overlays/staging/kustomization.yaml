apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Staging ingress files (environment-specific hostnames)
  - ingress/argocd-ingress.yaml
  - ingress/ballroom-competition-web-ingress.yaml
  - ingress/ballroom-syllabi-ingress.yaml
  - ingress/personal-site-ingress.yaml
  - ingress/petfoodfinder-ingress.yaml
  - ingress/spotifybutler-ingress.yaml
  - ingress/vigilo-ingress.yaml

  # ballroom-progress-tracker: staging only, so the whole app lives in this
  # overlay rather than in base. Production runs neither the app nor the
  # ballroom_progress database it needs.
  - ballroom-progress-tracker/deployment.yaml
  - ballroom-progress-tracker/service.yaml
  - ballroom-progress-tracker/onepassword-secret.yaml
  - ballroom-progress-tracker/migrate-job.yaml
  - ballroom-progress-tracker/seed-job.yaml
  - ingress/ballroom-progress-tracker-ingress.yaml

# Staging runs the whole stack on one small node, so the base's
# production-shaped reservations do not fit alongside the database. These are
# requests only -- what has to be reserved to schedule -- and the limits in the
# base still apply, so nothing is capped lower than before under real load.
patches:
  - target:
      kind: Deployment
      name: ballroom-competition-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 250m
          memory: 512Mi

# Session signing key. Rotating it signs everyone out, so it is a stored
# secret rather than something generated per deploy.
#
# Create the item before this syncs:
#   vault Kubernetes, item "ballroom-progress-tracker-auth",
#   field BETTER_AUTH_SECRET = openssl rand -base64 32
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ballroom-progress-tracker-auth
  namespace: web
spec:
  itemPath: "vaults/Kubernetes/items/ballroom-progress-tracker-auth"

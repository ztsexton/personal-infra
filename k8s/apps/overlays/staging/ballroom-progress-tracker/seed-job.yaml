# Seed the staging database.
#
# A PostSync hook, not PreSync: the migration is PreSync, and seeding has to
# happen after the schema exists. Argo runs PostSync only once the sync itself
# succeeded, which is also the right ordering -- there is no point seeding a
# deployment that failed to roll out.
#
# The seed is idempotent by construction (every step is an ensure*/upsert that
# checks before writing), so re-running it on each sync is safe and is what
# keeps a rebuilt environment populated without anyone remembering to do it.
#
# Uses the -seed image, not the app image: prisma/seed.ts needs tsx, the
# TypeScript sources and the "@/" path aliases, none of which exist in the
# standalone runtime bundle.
apiVersion: batch/v1
kind: Job
metadata:
  name: ballroom-progress-tracker-seed
  namespace: web
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: zot-registry-credentials
      containers:
        - name: seed
          image: ghcr.io/ztsexton/ballroom-progress-tracker:main-seed
          # `main-seed` is a mutable tag; without this the node keeps whichever
          # copy it cached first, however many times the tag is rebuilt.
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ballroom-db-pguser-progress
                  key: uri
            # The seed calls Better Auth's sign-up API to create accounts, so it
            # needs the same signing secret the app runs with -- otherwise the
            # accounts it creates cannot be used to sign in.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ballroom-progress-tracker-auth
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              value: "https://tracker-staging.zachsexton.com"
            - name: DEFAULT_STUDIO_SLUG
              value: "demo-ballroom-studio"
            # The owner account. Everything else the seed creates is an
            # @example.com fixture on a shared demo password.
            - name: SEED_ADMIN_EMAIL
              value: "zsexton2011@gmail.com"
            - name: SEED_ADMIN_NAME
              value: "Zach Sexton"
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ballroom-progress-tracker-auth
                  key: SEED_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

# Pull secret for the private container registry.
#
# Previously created by hand with kubectl, which meant it existed in no
# repository and had to be recreated from memory on every rebuild. The 1Password
# item it comes from already carries a field named `.dockerconfigjson`, so the
# operator can produce the secret directly -- the `type` below is what makes it a
# docker-registry secret rather than an Opaque one.
#
# The item's value should hold every registry the cluster pulls from, so that it
# stays valid across a registry migration:
#   {"auths":{"zot.zachsexton.com":{"auth":"..."},"ghcr.io":{"auth":"..."}}}
#
# Name is kept as zot-registry-credentials because both deployments reference it
# in imagePullSecrets; renaming it would have to change here and in production at
# the same instant.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: zot-registry-credentials
  namespace: web
type: kubernetes.io/dockerconfigjson
spec:
  itemPath: "vaults/Kubernetes/items/zot-docker-config"
